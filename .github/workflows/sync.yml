name: 同步+复制+修改
on:
  schedule:
    # 每 3 天 UTC 0 点自动运行一次（GitHub Actions 用 UTC 时区；想立即运行可到 Actions 页手动 Run workflow）
    - cron: '0 0 */3 * *'
  workflow_dispatch:
jobs:
  auto_sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      # 同步上游：用 git merge 合入上游提交（而非 checkout 覆盖），
      # 这样上游文件各自保留其原始提交说明；仅我们自己复制出来的 hi.json
      # 才使用下面的「auto: 同步+复制+修改」提交说明。
      # 本仓库从未手工改过上游文件，merge 不会冲突（上游文件内容一致）。
      - name: 合并上游官方仓库（保留上游提交信息）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/qist/tvbox.git || git remote set-url upstream https://github.com/qist/tvbox.git
          git fetch upstream master
          # 合入上游提交；上游文件的改动会保留各自原始 message
          git merge upstream/master --no-edit

      - name: 生成 hi.json（仅此文件用我们的提交说明）
        run: |
          # 兜底：若上游未提供 jsm.json，直接从 raw 下载，避免 cp 失败
          if [ ! -f jsm.json ]; then
            echo "未取到 jsm.json，改从上游 raw 直接下载兜底"
            curl -fsSL https://raw.githubusercontent.com/qist/tvbox/master/jsm.json -o jsm.json
          fi
          cp jsm.json hi.json
          sed -i 's|"搜索 • 豆瓣"|"Hello~"|g' hi.json
          # 只提交 hi.json，绝不碰其它上游文件的历史说明
          git add hi.json
          if git diff --cached --quiet; then
            echo "hi.json 无变更无需提交"
          else
            git commit -m "auto: 同步+复制+修改"
            git push
          fi
