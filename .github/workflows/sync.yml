name: 同步+复制+修改
on:
  schedule:
    # 每 3 天 UTC 0 点自动运行一次（GitHub Actions 用 UTC 时区；想立即运行可到 Actions 页手动 Run workflow）
    - cron: '0 0 */3 * *'
  workflow_dispatch:
jobs:
  auto_sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      # 同步上游：用「checkout 覆盖」而非 merge，从根上避免合并冲突；
      # 显式备份/恢复自己维护的 .github/ 与 functions/，防止被上游覆盖或删除。
      # 注意：不做任何「清理差异文件」的操作 —— 那一步会把 jsm.json 误删，导致后续 cp 失败。
      - name: 同步上游官方仓库（保留自身文件，杜绝冲突与误删）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/qist/tvbox.git || git remote set-url upstream https://github.com/qist/tvbox.git
          git fetch upstream master

          # ① 备份自己维护、上游没有的目录（防止被上游覆盖或删除）
          rm -rf /tmp/self_keep
          mkdir -p /tmp/self_keep
          [ -d .github ]     && cp -r .github     /tmp/self_keep/.github
          [ -d functions ]   && cp -r functions   /tmp/self_keep/functions

          # ② 用上游内容覆盖工作区（checkout 覆盖、不走 merge，绝无冲突；
          #    上游真实存在 jsm.json，此步即把它拉进工作区）
          git checkout upstream/master -- .

          # ③ 恢复自己维护的目录（确保自身文件不丢）
          [ -d /tmp/self_keep/.github ]   && rm -rf .github   && cp -r /tmp/self_keep/.github   .
          [ -d /tmp/self_keep/functions ] && rm -rf functions && cp -r /tmp/self_keep/functions .

      - name: 复制 jsm.json 为 hi.json（含兜底下载）
        run: |
          # 兜底：万一 checkout 没取到 jsm.json，直接从上游 raw 下载，避免 cp 失败
          if [ ! -f jsm.json ]; then
            echo "checkout 未取到 jsm.json，改从上游 raw 直接下载兜底"
            curl -fsSL https://raw.githubusercontent.com/qist/tvbox/master/jsm.json -o jsm.json
          fi
          cp jsm.json hi.json
          sed -i 's|"搜索 • 豆瓣"|"Hello~"|g' hi.json

      - name: 提交并推送变更
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "无变更无需提交"
          else
            git commit -m "auto: 同步+复制+修改"
            git push
          fi
